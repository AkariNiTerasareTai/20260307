<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>柴咲あかり お誕生日＆卒業祝い ファンサイト</title>
    <meta name="description" content="柴咲あかりさんのお誕生日とご卒業を祝うファンサイトです。" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=M+PLUS+Rounded+1c:wght@400;700&family=Nunito:wght@400;700;800&display=swap"
        rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="./src/style.css">
</head>

<body>
    <div id="app" class="app-container">
        <!-- Modern Sticky Header Navigation -->
        <header class="main-header">
            <nav class="nav-links">
                <a href="#home" class="nav-link active" data-page="home">
                    <i class="fa-solid fa-house"></i> <span>Home</span>
                </a>
                <a href="#message" class="nav-link" data-page="message">
                    <i class="fa-solid fa-comment-dots"></i> <span>Message</span>
                </a>
                <a href="#gallery" class="nav-link" data-page="gallery">
                    <i class="fa-solid fa-image"></i> <span>Gallery</span>
                </a>
                <a href="#movie" class="nav-link" data-page="movie">
                    <i class="fa-brands fa-youtube"></i> <span>Movie</span>
                </a>
                <a href="#profile" class="nav-link" data-page="profile">
                    <i class="fa-solid fa-user"></i> <span>Profile</span>
                </a>
            </nav>
        </header>

        <main class="main-content">
            <!-- Page: Home -->
            <section id="home" class="page-section active">
                <div class="hero-section">
                    <div class="hero-card">
                        <h1 class="hero-title">
                            <span class="en">Happy Birthday</span>
                            <span class="en">& Graduation!</span>
                        </h1>
                        <h2 class="hero-name">柴咲あかり</h2>
                        <div class="hero-date en">2026.03.07</div>
                    </div>
                </div>
            </section>

            <!-- Page: Message -->
            <section id="message" class="page-section">
                <div class="page-container">
                    <div class="message-board-header">
                        <h2 class="section-title en" style="margin-bottom: 0;">MESSAGE BOARD</h2>
                        <button class="add-message-btn" id="open-modal-btn">
                            <i class="fa-solid fa-plus"></i> <span>メッセージを贈る</span>
                        </button>
                    </div>

                    <div class="message-board-layout">
                        <div class="messages-list" id="messages-list">
                            <!-- JSで動的に追加 -->
                            <div class="loading-messages">
                                <i class="fa-solid fa-circle-notch fa-spin"></i> メッセージを読み込み中...
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Page: Gallery -->
            <section id="gallery" class="page-section">
                <div class="page-container">
                    <h2 class="section-title en">カメアイ GALLERY</h2>
                    <div class="gallery-grid" id="gallery-grid"></div>
                </div>
            </section>

            <!-- Page: Movie -->
            <section id="movie" class="page-section">
                <div class="page-container">
                    <h2 class="section-title en">SPECIAL MOVIES</h2>
                    <div class="movie-carousel-wrapper">
                        <div class="movie-carousel">
                            <div class="movie-item">
                                <iframe width="100%" height="250" src="https://www.youtube.com/embed/V6Wv_qLz634"
                                    title="YouTube video player" frameborder="0"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                    allowfullscreen></iframe>
                            </div>
                            <div class="movie-item">
                                <iframe width="100%" height="250" src="https://www.youtube.com/embed/8yU9Rk7K3-M"
                                    title="YouTube video player" frameborder="0"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                    allowfullscreen></iframe>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Page: Profile -->
            <section id="profile" class="page-section">
                <div class="page-container">
                    <h2 class="section-title en">PROFILE</h2>
                    <div class="profile-content">
                        <div class="profile-visual">
                            <img src="./assets/cameai_001.JPG" alt="柴咲あかり">
                        </div>
                        <div class="profile-details">
                            <h3>柴咲 あかり</h3>
                            <p class="furigana en">Akari Shibasaki</p>
                            <ul class="profile-details-list">
                                <li><strong>Birthday:</strong> 3月7日</li>
                                <li><strong>Blood Type:</strong> A型</li>
                                <li><strong>Member Color:</strong> 紫</li>
                            </ul>
                            <div class="sns-bar">
                                <a href="https://x.com/Kareai_akari" target="_blank" class="sns-item"
                                    style="background: #000;"><i class="fa-brands fa-x-twitter"></i></a>
                                <a href="https://www.instagram.com/akari_kareai/" target="_blank" class="sns-item"
                                    style="background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);"><i
                                        class="fa-brands fa-instagram"></i></a>
                                <a href="https://www.tiktok.com/@kareai_akari_official" target="_blank" class="sns-item"
                                    style="background: #000;"><i class="fa-brands fa-tiktok"></i></a>
                                <a href="https://www.showroom-live.com/room/profile?room_id=370252" target="_blank"
                                    class="sns-item" style="background: #3bb2ed;"><i class="fa-solid fa-video"></i></a>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="main-footer">
            <p>© 2026 Unofficial Fan Site for Akari Shibasaki</p>
        </footer>

        <!-- Lightbox -->
        <div id="lightbox" class="lightbox">
            <button class="lightbox-close"><i class="fa-solid fa-xmark"></i></button>
            <img id="lightbox-img" src="" alt="Enlarged" />
        </div>

        <canvas id="confetti-canvas"></canvas>

        <!-- Message Modal -->
        <div id="message-modal" class="modal-overlay">
            <div class="modal-content">
                <button class="modal-close" id="close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
                <h3 class="en" style="color: var(--primary-dark); margin-bottom: 20px; font-size: 1.5rem;">Send Message
                </h3>
                <form id="message-form">
                    <div class="form-group">
                        <label for="name">ペンネーム</label>
                        <input type="text" id="name" name="name" required placeholder="名前を書いてください" />
                    </div>
                    <div class="form-group">
                        <label for="message-input">メッセージ</label>
                        <textarea id="message-input" name="message" rows="4" required
                            placeholder="お祝いメッセージを書いてください"></textarea>
                    </div>
                    <button type="submit" class="submit-btn" id="submit-btn">
                        <span>メッセージを贈る</span> <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>

        <button id="back-to-top" class="back-to-top" aria-label="Go to top">
            <i class="fa-solid fa-chevron-up"></i>
        </button>

        <!-- CDN Libraries -->
        <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
        <script src="./src/main.js"></script>
</body>

</html>
